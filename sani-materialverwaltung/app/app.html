<title>Materialverwaltung Sani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: App-Shell – Kopfzeile mit Reitern, darunter Liste|Detail (Artikel), Inventarliste (Lager), Stammdaten-Karten */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --sunken:#eaecf4; --line:#d9dce8; --fg:#141729; --muted:#595e74;
  --accent:#000099; --accent-ink:#ffffff; --accent-soft:#e1e3f8;
  --danger:#c4001a; --danger-soft:#f8e1df; --warn:#8a5a00; --warn-soft:#fbefd2;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px; --gut:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f19; --surface:#151826; --sunken:#1c2032; --line:#2a2f45; --fg:#e4e6f0; --muted:#9298b0;
  --accent:#8c96ff; --accent-ink:#070a2a; --accent-soft:#1f2456;
  --danger:#ff8b80; --danger-soft:#3a1b19; --warn:#f1c063; --warn-soft:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f19; --surface:#151826; --sunken:#1c2032; --line:#2a2f45; --fg:#e4e6f0; --muted:#9298b0;
  --accent:#8c96ff; --accent-ink:#070a2a; --accent-soft:#1f2456;
  --danger:#ff8b80; --danger-soft:#3a1b19; --warn:#f1c063; --warn-soft:#3a2e12; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-inline:var(--gut);display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;white-space:nowrap}
.logo{height:44px;width:auto;flex:none;background:#fff;border-radius:5px;padding:2px 4px;display:block}
.brand .app{font-weight:600;color:var(--muted);font-size:15px;border-left:1px solid var(--line);padding-left:10px}
@media (max-width:520px){.brand .app{display:none}}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg)}
nav.tabs button:hover{color:var(--fg)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)}.dot.busy{background:var(--warn)}.dot.err{background:var(--danger)}

main{max-width:1280px;margin:0 auto;padding:18px var(--gut) 40px}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px}

/* Steuerelemente */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}
input[type=text],input[type=number],input[type=search],input[type=tel],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
label.f>*{text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);font-size:15px}
label.f>span.lh{text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.ghost{border-style:dashed}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:30px;height:30px;cursor:pointer;font-size:17px;color:var(--muted)}
.stepper button:hover{background:var(--sunken);color:var(--fg)}
.stepper input{border:0;width:52px;text-align:center;padding:4px 0;border-radius:0;font-family:var(--f-mono)}
.stepper input:focus{box-shadow:none}
.stepper.ro button{display:none}

/* Artikel */
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.list-head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.list-head .row{display:flex;gap:8px}
.alist{max-height:calc(100vh - 230px);overflow:auto}
.aitem{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.aitem:hover{background:var(--sunken)}
.aitem[aria-current="true"]{background:var(--accent-soft)}
.aitem .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem .kt{font-size:12px;color:var(--muted)}
.aitem .nr{font-size:13px;color:var(--muted)}
.count{font-family:var(--f-mono);font-size:12px;background:var(--sunken);border-radius:999px;padding:1px 8px;color:var(--muted)}
.count.zero{background:var(--warn-soft);color:var(--warn)}
.list-foot{padding:8px 12px;font-size:12px;color:var(--muted)}
.detail{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.d-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.d-head h2{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance;flex:1;min-width:200px}
.d-head .nr{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid-form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
h3.sec{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.loc b{font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px}
.addrow select{flex:1;min-width:180px;width:auto}
.addrow input{width:80px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.confirm{display:flex;gap:8px;align-items:center;background:var(--danger-soft);padding:8px 10px;border-radius:6px;flex-wrap:wrap;font-size:14px}
.back{display:none}

/* Lager */
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.toolbar .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;min-width:70px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.summary{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;align-items:center}
.summary .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.summary .v{font-family:var(--f-mono);font-size:20px;font-weight:500}
.progress{flex:1;min-width:160px;height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.group{margin-bottom:14px}
.group-h{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.group-h h3{margin:0;font-size:16px}
.group-h .lager{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.group-h .n{margin-left:auto;font-size:12px;color:var(--muted)}
tr.done td{color:var(--muted)}
tr.done td.an{text-decoration:line-through}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.alink{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:600}
.alink:hover{color:var(--accent);text-decoration:underline}

/* Stammdaten */
.cards{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
.card-b{padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
input.inline-in{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:4px;width:100%}
input.inline-in:hover{border-color:var(--line)}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}


/* Berichte */
.rep-sel{margin-bottom:18px}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.rep .card-b{gap:14px}
.rep h2{margin:0;font-size:18px;letter-spacing:-.01em}
.rep p.d{margin:0;font-size:14px;color:var(--muted);max-width:60ch}
.rep .src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.opt .tlabel{min-width:84px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:16px;height:16px}
.rep-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.rep-foot .meta{font-size:13px;color:var(--muted);flex:1;min-width:160px}
.label-prev{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.lbl{background:#fff;color:#111;border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:4px 6px;display:flex;flex-direction:column;overflow:hidden;font-family:Helvetica,Arial,sans-serif}
.lbl .t{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.lbl b{font-weight:700}
.lbl.s{width:162px;height:51px}.lbl.s b{font-size:11px}.lbl.s .n{font-size:9px;line-height:1.15}.lbl.s .o{font-size:7px;color:#555}
.lbl.l{width:270px;height:87px;padding:6px 9px}.lbl.l b{font-size:19px}.lbl.l .n{font-size:13px;line-height:1.2}.lbl.l .o{font-size:10px;color:#555}

/* Lieferanten */
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.contact .ci{background:var(--sunken);border-radius:6px;padding:9px 11px;min-width:0;display:flex;flex-direction:column;gap:2px}
.contact .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.contact .v{display:flex;gap:6px;align-items:center;min-width:0}
.contact .v span,.contact .v a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all;min-width:0}
.contact a{color:var(--accent);font-weight:600}
.copy{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px;flex:none}
.copy:hover{color:var(--fg)}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.lnk:hover{text-decoration:underline}
.aitem.none .nm{font-style:italic;color:var(--muted)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.modal-bg[hidden]{display:none}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(8,10,30,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 48px rgba(0,0,0,.25);width:100%;max-width:420px;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px;display:flex;gap:10px;align-items:center}
.modal h3::before{content:"!";flex:none;width:24px;height:24px;border-radius:50%;background:var(--danger-soft);color:var(--danger);font-weight:800;display:grid;place-items:center;font-size:14px}
.modal p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.modal p b{color:var(--fg);font-weight:600}
.m-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
/* Lagerorte in drei Ebenen */
.picker{display:flex;flex-direction:column;gap:8px}
.area-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.chip.area{font-weight:700;min-width:118px;text-align:left}
.chip.area[data-partial]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.area-row .chips{flex:1;min-width:0}
.tree{display:flex;flex-direction:column;gap:14px}
.tree-area{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tree-area>h4{margin:0;padding:9px 12px;background:var(--sunken);font-size:15px;display:flex;align-items:baseline;gap:10px}
.tree-area>h4 .n{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.tree-box{border-top:1px solid var(--line)}
.tree-box:first-of-type{border-top:0}
.box-h{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;flex-wrap:wrap}
.box-h .lvl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:58px;flex:none}
.box-h input.inline-in{font-weight:600;max-width:260px}
.box-h select{width:auto;padding:4px 8px;font-size:13px}
.box-h .n{margin-left:auto;font-size:12px;color:var(--muted)}
.fach{display:grid;grid-template-columns:58px minmax(0,1fr) 74px 56px 74px;gap:8px;align-items:center;padding:3px 10px 3px 32px;font-size:14px}
.fach .lvl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fach:last-child{padding-bottom:8px}
.fach .cnt{text-align:right;font-family:var(--f-mono);color:var(--muted);font-size:13px}
.newplace{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end}
@media (max-width:860px){.newplace{grid-template-columns:1fr 1fr}.fach{grid-template-columns:minmax(0,1fr) 64px 40px 64px;padding-left:18px}.fach .lvl{display:none}}
/* Mehrere Lagerplätze hinzufügen */
.addpanel{border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;margin-top:4px}
.ap-head{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.ap-head input[type=search]{flex:1;min-width:160px;width:auto}
.ap-head label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.ap-head input[type=number]{width:70px}
.ap-list{max-height:380px;overflow:auto;padding-bottom:6px}
.ap-area{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);padding:10px 12px 4px;position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid var(--line)}
.ap-row{display:grid;grid-template-columns:20px minmax(0,1fr) 78px;gap:10px;align-items:center;padding:4px 12px;cursor:pointer}
.ap-row:hover{background:var(--sunken)}
.ap-row.box{font-weight:600;padding-top:7px}
.ap-row.sub{padding-left:40px}
.ap-row .muted{font-weight:400}
.ap-row input[type=number]{width:78px;padding:4px 8px;font-family:var(--f-mono)}
.ap-row input[type=number]:disabled{opacity:.35}
.ap-foot{display:flex;gap:8px;align-items:center;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.ap-foot .meta{flex:1;color:var(--muted);font-size:13px;min-width:140px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .rep-grid{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .split.show-detail .list-panel{display:none}
  .split:not(.show-detail) .detail-panel{display:none}
  .back{display:inline-flex}
  .alist{max-height:none}
  .cards{grid-template-columns:1fr}
  .grid-form{grid-template-columns:1fr 1fr}
  .c2,.c3{grid-column:span 1}.c4,.c6{grid-column:span 2}
  .sync span{display:none}
}
@media (max-width:420px){.grid-form{grid-template-columns:1fr}.c2,.c3,.c4,.c6{grid-column:span 1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const natcmp = (a, b) => String(a).localeCompare(String(b), "de-CH", {numeric: true, sensitivity: "base"});
const store = {
  get(k, d) { try { const v = localStorage.getItem("sani:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sani:" + k, JSON.stringify(v)); } catch {} }
};

const S = {
  db: null, dl: null, canWrite: true, noDb: false,
  artikel: new Map(), plaetze: new Map(), meta: {kategorien: [], lager: [], einheiten: ["Stück","Pack","Box"]},
  loaded: {artikel: false, plaetze: false, meta: false, lief: false},
  lief: new Map(), lsel: null, lnew: null, ldirty: false, lqs: "",
  local: new Map(),            // optimistische Artikel-Versionen, solange ein Schreibvorgang läuft
  tab: store.get("tab", "artikel"),
  sel: null, q: "", kat: "", onlyEmpty: false, newDraft: null, dirty: false, confirmDel: false,
  rep: Object.assign({units: null, sort: "nr", check: true, pageLager: false, titel: true, kontrollfeld: true, onlyStock: true, labFmt: "17x54", labMode: "artikel", labLoc: true, labQ: "", artKat: "", artLief: ""}, store.get("rep", {})),
  lagerSel: store.get("units", null) ? new Set(store.get("units", [])) : null, sort: store.get("sort", "nr"),
  addOpen: false, addSel: new Map(), addQ: "", addDef: 1,
  kontrolle: false, checked: new Set(store.get("checked", [])), lq: "",
};
const art = id => S.local.get(id) || S.artikel.get(id);
const allArt = () => { const m = new Map(S.artikel); for (const [k, v] of S.local) v ? m.set(k, v) : m.delete(k); return m; };
const liefOf = a => (a?.lieferantId && S.lief.get(a.lieferantId)) || null;
const liefName = a => liefOf(a)?.name || a?.lieferant || "";
const sortedLief = () => [...S.lief.entries()].sort((x, y) => natcmp(x[1].name, y[1].name));
const webUrl = w => { w = String(w || "").trim(); return !w ? "" : /^https?:\/\//i.test(w) ? w : "https://" + w; };
const total = a => Object.values(a.bestand || {}).reduce((s, n) => s + (+n || 0), 0);
const SEP = " › ";
const DEFAULT_BEREICHE = ["Posten 1", "Posten 2", "Erdgeschoss", "Untergeschoss"];
const bereiche = () => { const b = [...(S.meta.bereiche?.length ? S.meta.bereiche : DEFAULT_BEREICHE)]; for (const p of S.plaetze.values()) if (p.bereich && !b.includes(p.bereich)) b.push(p.bereich); return b; };
const bIdx = b => { const i = bereiche().indexOf(b); return i < 0 ? 999 : i; };
function normPlatz(d) {   // Ebene 1 Bereich › Ebene 2 Behälter › Ebene 3 Fach; ältere Daten (lager/platz) werden gelesen
  const x = d.bereich !== undefined ? {bereich: d.bereich || "", behaelter: d.behaelter || "", fach: d.fach || "", sortierung: +d.sortierung || 0}
    : {bereich: d.lager || "", behaelter: "", fach: d.platz || "", sortierung: +d.sortierung || 0};
  x.lager = x.behaelter ? x.bereich + SEP + x.behaelter : x.bereich;   // Auswahl-Einheit: Behälter (oder Bereich direkt)
  return x;
}
const placeDoc = p => ({bereich: p.bereich, behaelter: p.behaelter, fach: p.fach, sortierung: +p.sortierung || 0});
const loc = p => p ? [p.bereich, p.behaelter, p.fach].filter(Boolean).join(SEP) : "Unbekannter Platz";
const inner = p => [p.behaelter, p.fach].filter(Boolean).join(SEP) || "ohne Behälter";
const platzLabel = id => loc(S.plaetze.get(id));
const placeCmp = (a, b) => bIdx(a.bereich) - bIdx(b.bereich) || natcmp(a.behaelter, b.behaelter) || (a.sortierung - b.sortierung) || natcmp(a.fach, b.fach);
const sortedPlaetze = () => [...S.plaetze.entries()].sort((a, b) => placeCmp(a[1], b[1]));
function units() { const m = new Map(); for (const [, p] of sortedPlaetze()) if (!m.has(p.lager)) m.set(p.lager, {bereich: p.bereich, behaelter: p.behaelter}); return m; }
const lagerList = () => [...units().keys()];
const areaUnits = b => [...units()].filter(([, i]) => i.bereich === b).map(([u]) => u);
function selSummary(sel) {
  const parts = [];
  for (const b of bereiche()) { const us = areaUnits(b); if (!us.length) continue; const on = us.filter(u => sel.has(u));
    if (!on.length) continue; parts.push(on.length === us.length ? b : b + ": " + on.map(u => units().get(u).behaelter || "ohne Behälter").join(", ")); }
  return parts.join(" · ");
}
function unitPicker(sel, uAttr, aAttr) {
  const U = units();
  return `<div class="picker">${bereiche().map(b => { const us = [...U].filter(([, i]) => i.bereich === b); if (!us.length) return "";
    const all = us.every(([u]) => sel.has(u)), some = us.some(([u]) => sel.has(u));
    return `<div class="area-row"><button class="chip area" ${aAttr}="${esc(b)}" aria-pressed="${all}" ${some && !all ? "data-partial" : ""}>${esc(b)}</button><div class="chips">${us.map(([u, i]) => `<button class="chip" ${uAttr}="${esc(u)}" aria-pressed="${sel.has(u)}">${esc(i.behaelter || "ohne Behälter")}</button>`).join("")}</div></div>`; }).join("")}</div>`;
}
function toggleArea(sel, b) { const us = areaUnits(b), all = us.every(u => sel.has(u)); for (const u of us) all ? sel.delete(u) : sel.add(u); }

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- Sync-Anzeige & Schreiben ---------- */
let inflight = 0, lastErr = null;
function syncUi() {
  const d = $("#syncdot"), t = $("#synctxt");
  if (S.noDb) { d.className = "dot err"; t.textContent = "Keine Datenbank"; return; }
  if (lastErr) { d.className = "dot err"; t.textContent = "Nicht gespeichert"; return; }
  if (inflight) { d.className = "dot busy"; t.textContent = "Speichert …"; return; }
  const ready = S.loaded.artikel && S.loaded.plaetze;
  d.className = "dot " + (ready ? "ok" : ""); t.textContent = ready ? (S.canWrite ? "Gespeichert" : "Nur Lesen") : "Lädt …";
}
const queues = new Map();
function errMsg(e) {
  if (e?.code === "invalid_argument") { S.canWrite = false; render(); return "Keine Schreibrechte – Änderungen werden nicht gespeichert."; }
  if (e?.code === "quota_exceeded") return "Speicher voll: " + (e.message || "");
  return "Speichern fehlgeschlagen. Bitte erneut versuchen.";
}
function write(path, data) {            // data === null → löschen; pro Dokument immer nur ein Schreibvorgang
  let q = queues.get(path);
  if (!q) { q = {pending: undefined, running: false}; queues.set(path, q); }
  q.pending = data; q.has = true;
  if (!q.running) run(path, q);
  return q;
}
async function run(path, q) {
  q.running = true; inflight++; syncUi();
  while (q.has) {
    const d = q.pending; q.has = false;
    try { d === null ? await S.db.doc(path).delete() : await S.db.doc(path).set(d); lastErr = null; }
    catch (e) {
      if (e?.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); try { d === null ? await S.db.doc(path).delete() : await S.db.doc(path).set(d); continue; } catch (e2) { e = e2; } }
      lastErr = e; toast(errMsg(e));
    }
  }
  q.running = false; inflight--;
  if (path.startsWith("artikel/")) { const id = path.slice(8); if (!timers.has(id)) S.local.delete(id); render(); }
  syncUi();
}
/* Bestandsänderungen: sofort anzeigen, kurz sammeln, dann speichern */
const timers = new Map();
function changeBestand(id, platzId, n) {
  const a = structuredClone(art(id)); if (!a) return;

function savePlace(id, p) { const n = normPlatz(placeDoc(p)); S.plaetze.set(id, n); write("plaetze/" + id, placeDoc(n)); }
function moveUnit(unit, patch) {   // Behälter umbenennen oder in anderen Bereich verschieben

  const tgt = {bereich: patch.bereich ?? list[0][1].bereich, behaelter: patch.behaelter ?? list[0][1].behaelter};
  const clash = [...S.plaetze.entries()].some(([pid, p]) => p.lager !== unit && p.bereich === tgt.bereich && p.behaelter.toLowerCase() === tgt.behaelter.toLowerCase());
  if (clash) { toast(`«${tgt.behaelter}» gibt es in ${tgt.bereich} schon.`); return false; }
  const swap = s => s === unit ? (tgt.behaelter ? tgt.bereich + SEP + tgt.behaelter : tgt.bereich) : s;

/* ---------- Sicherheitsabfrage ---------- */
let confirmFn = null, confirmReturn = null;
function ask(title, html, yes, fn) {
  confirmFn = fn; confirmReturn = document.activeElement;
  $("#m-title").textContent = title; $("#m-text").innerHTML = html; $("#m-yes").textContent = yes || "Löschen";
  $("#modal").hidden = false; $("#m-no").focus();
}
function closeAsk(run) {
  const fn = confirmFn; confirmFn = null; $("#modal").hidden = true;
  if (run && fn) fn(); else if (confirmReturn && document.contains(confirmReturn)) confirmReturn.focus();
}
document.addEventListener("keydown", e => {
  if ($("#modal").hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closeAsk(false); }
  if (e.key === "Tab") { const a = $("#m-no"), b = $("#m-yes"); if (e.shiftKey && document.activeElement === a) { e.preventDefault(); b.focus(); } else if (!e.shiftKey && document.activeElement === b) { e.preventDefault(); a.focus(); } }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeAsk(false); });

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-check]"); if (!t) return;
  if (t.id === "m-yes") { closeAsk(true); return; }
  if (t.id === "m-no") { closeAsk(false); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; store.set("tab", S.tab); $("#main").innerHTML = ""; render(); return; }
  if (t.classList.contains("aitem") && !t.dataset.lid) {
    if (S.dirty && S.sel !== t.dataset.id && !t.dataset.force) { toast("Ungespeicherte Änderungen verworfen."); }
    if (S.sel !== t.dataset.id) resetAdd();
    S.sel = t.dataset.id; S.newDraft = null; S.dirty = false; S.confirmDel = false; render();
    if (matchMedia("(max-width:860px)").matches) scrollTo(0, 0); return;
  }
  if (t.id === "new") { S.sel = null; S.dirty = false; S.newDraft = {nr: "", name: "", kategorie: S.kat || S.meta.kategorien[0] || "", einheit: "Stück", mengeProEinheit: 1, bestand: {}}; render(); $("#f-nr")?.focus(); return; }
  if (t.id === "back") { resetAdd(); S.sel = null; S.newDraft = null; S.dirty = false; render(); return; }
  if (t.id === "del") { const id = S.sel, a = art(id), n = Object.keys(a?.bestand || {}).length;
    ask("Artikel löschen?", `<b>${esc(a?.nr)} · ${esc(a?.name)}</b> wird endgültig gelöscht${n ? `, zusammen mit den Beständen an ${n} Lagerplätz${n === 1 ? "" : "en"} (${total(a)} Stück)` : ""}. Das lässt sich nicht rückgängig machen.`, "Artikel löschen",
      () => { S.local.set(id, null); write("artikel/" + id, null); if (S.sel === id) { S.sel = null; S.dirty = false; } toast("Artikel gelöscht"); render(); }); return; }


  if (t.dataset.rm) { const id = S.sel, pid = t.dataset.rm, a = art(id), n = a?.bestand?.[pid] ?? 0;
    ask("Vom Lagerplatz entfernen?", `<b>${esc(a?.name)}</b> wird aus <b>${esc(platzLabel(pid))}</b> entfernt. Der Bestand dort (${n} Stück) geht verloren.`, "Entfernen", () => changeBestand(id, pid, null)); return; }
  if (t.id === "add-open") { resetAdd(); S.addOpen = true; render(); $("#add-q")?.focus(); return; }
  if (t.id === "add-cancel") { resetAdd(); render(); return; }
  if (t.id === "add-many") { addMany(); return; }
  if (t.dataset.d) { const sp = t.closest(".stepper"); const inp = $("input", sp); const n = Math.max(0, (parseInt(inp.value) || 0) + +t.dataset.d); inp.value = n; changeBestand(sp.dataset.a, sp.dataset.p, n); return; }
  if (t.classList.contains("litem")) { if (S.ldirty && S.lsel !== t.dataset.lid) toast("Ungespeicherte Änderungen verworfen."); S.lsel = t.dataset.lid; S.lnew = null; S.ldirty = false; render(); if (matchMedia("(max-width:860px)").matches) scrollTo(0, 0); return; }
  if (t.id === "lnew") { S.lsel = null; S.ldirty = false; S.lnew = Object.fromEntries(LF.map(([k]) => [k, ""])); render(); $("#lf-name")?.focus(); return; }
  if (t.id === "lback") { S.lsel = null; S.lnew = null; S.ldirty = false; render(); return; }
  if (t.dataset.openlief) { S.tab = "lief"; store.set("tab", "lief"); S.lsel = t.dataset.openlief; S.ldirty = false; $("#main").innerHTML = ""; render(); scrollTo(0, 0); return; }
  if (t.id === "ldel") { const lid = S.lsel, n = liefArtikel(lid).length;
    ask("Lieferant löschen?", `<b>${esc(S.lief.get(lid)?.name)}</b> wird endgültig gelöscht.${n ? ` ${n} Artikel verlieren dabei ihren Lieferanten, bleiben aber erhalten.` : ""}`, "Lieferant löschen",
      () => { for (const [aid] of liefArtikel(lid)) setArtLief(aid, ""); S.lief.delete(lid); write("lieferanten/" + lid, null); if (S.lsel === lid) { S.lsel = null; S.ldirty = false; } toast("Lieferant gelöscht"); render(); }); return; }


  if (t.id === "lassign-btn") { const aid = $("#lassign").value; if (aid) { setArtLief(aid, S.lsel); toast("Artikel zugeordnet"); } return; }
  if (t.dataset.unlink) { const aid = t.dataset.unlink, a = art(aid);
    ask("Verknüpfung lösen?", `<b>${esc(a?.nr)} · ${esc(a?.name)}</b> wird von <b>${esc(liefName(a))}</b> gelöst und steht danach unter «Ohne Lieferant». Der Artikel selbst und seine Lieferanten-Artikelnummer bleiben erhalten.`, "Lösen", () => { setArtLief(aid, ""); toast("Verknüpfung gelöst"); }); return; }
  if (t.dataset.copy != null) { const v = t.dataset.copy; navigator.clipboard?.writeText(v).then(() => toast("Kopiert"), () => toast("Kopieren nicht möglich – Text markieren")); return; }
  if (t.id === "lief-pdf") { S.rep.artLief = S.lsel; S.rep.artKat = ""; saveRep(); runPdf(pdfArtikel, t); return; }
  if (t.dataset.open) { S.tab = "artikel"; store.set("tab", "artikel"); S.sel = t.dataset.open; S.dirty = false; $("#main").innerHTML = ""; render(); scrollTo(0, 0); return; }
  if (t.dataset.lager) { const l = t.dataset.lager; S.lagerSel.has(l) ? S.lagerSel.delete(l) : S.lagerSel.add(l); store.set("units", [...S.lagerSel]); render(); return; }
  if (t.dataset.larea) { toggleArea(S.lagerSel, t.dataset.larea); store.set("units", [...S.lagerSel]); render(); return; }
  if (t.dataset.preset) { S.lagerSel = new Set(t.dataset.preset === "all" ? lagerList() : []); store.set("units", [...S.lagerSel]); render(); return; }
  if (t.dataset.sort) { S.sort = t.dataset.sort; store.set("sort", S.sort); render(); return; }
  if (t.id === "kontrolle") { S.kontrolle = !S.kontrolle; render(); return; }
  if (t.id === "reset-check") { for (const r of inventarRows()) S.checked.delete(r.id + ":" + r.pid); store.set("checked", [...S.checked]); render(); return; }
  if (t.id === "exp-inv") { exportRows("inv"); return; }
  if (t.id === "exp-lab") { exportRows("lab"); return; }
  if (t.dataset.rlager) { const L = repLager(), l = t.dataset.rlager; L.has(l) ? L.delete(l) : L.add(l); S.rep.units = [...L]; saveRep(); render(); return; }
  if (t.dataset.rarea) { const L = repLager(); toggleArea(L, t.dataset.rarea); S.rep.units = [...L]; saveRep(); render(); return; }
  if (t.dataset.rpreset) { S.rep.units = t.dataset.rpreset === "all" ? lagerList() : []; saveRep(); render(); return; }
  if (t.dataset.rset) { S.rep[t.dataset.rset] = t.dataset.val; saveRep(); render(); return; }
  if (t.id === "pdf-inv") { runPdf(pdfInventar, t); return; }
  if (t.id === "pdf-ueb") { runPdf(pdfUebersicht, t); return; }
  if (t.id === "pdf-lab") { runPdf(pdfEtiketten, t); return; }
  if (t.id === "pdf-art") { runPdf(pdfArtikel, t); return; }
  if (t.id === "np-add") {
    const bereich = $("#np-ber").value, behaelter = $("#np-beh").value.trim(), fach = $("#np-fach").value.trim();
    if (!behaelter && fach) { toast("Ein Fach braucht einen Behälter."); return; }
    if ([...S.plaetze.values()].some(p => p.bereich === bereich && p.behaelter.toLowerCase() === behaelter.toLowerCase() && p.fach.toLowerCase() === fach.toLowerCase())) { toast("Diesen Lagerort gibt es schon."); return; }
    const sort = parseInt($("#np-sort").value), same = [...S.plaetze.values()].filter(p => p.bereich === bereich && p.behaelter === behaelter);
    const id = nextId(S.plaetze); savePlace(id, {bereich, behaelter, fach, sortierung: Number.isFinite(sort) ? sort : (Math.max(0, ...same.map(p => p.sortierung)) + 1)});
    toast(`${loc(S.plaetze.get(id))} hinzugefügt`); render(); return;
  }
  if (t.dataset.delp) { const id = t.dataset.delp;
    ask("Lagerplatz löschen?", `Der leere Lagerplatz <b>${esc(platzLabel(id))}</b> wird gelöscht.`, "Platz löschen", () => { S.plaetze.delete(id); write("plaetze/" + id, null); toast("Lagerplatz gelöscht"); render(); }); return; }
  if (t.id === "nb-add") { const v = $("#nb").value.trim(); if (!v) return; if (bereiche().some(b => b.toLowerCase() === v.toLowerCase())) { toast("Diesen Bereich gibt es schon."); return; } saveMeta({bereiche: [...bereiche(), v]}); toast("Bereich hinzugefügt"); return; }
  if (t.dataset.bmove) { const B = bereiche(), i = +t.dataset.bmove, j = i + +t.dataset.dir; if (j < 0 || j >= B.length) return; [B[i], B[j]] = [B[j], B[i]]; saveMeta({bereiche: B}); return; }
  if (t.dataset.delb) { const b = t.dataset.delb;
    ask("Bereich entfernen?", `Der leere Bereich <b>${esc(b)}</b> wird aus der Liste entfernt.`, "Bereich entfernen", () => { saveMeta({bereiche: bereiche().filter(x => x !== b)}); toast("Bereich entfernt"); }); return; }
  if (t.id === "export-json") { exportJson(); return; }
  if (t.id === "ne-add") { const v = $("#ne").value.trim(); if (!v) return; const L = einheitList(); if (L.some(e => e.toLowerCase() === v.toLowerCase())) { toast("Diese Einheit gibt es schon."); return; } saveMeta({einheiten: [...L, v], einheitenListe: true}); toast("Einheit hinzugefügt"); return; }
  if (t.dataset.dele) { const e = t.dataset.dele;
    ask("Einheit entfernen?", `Die unbenutzte Bestelleinheit <b>${esc(e)}</b> wird aus der Auswahl entfernt.`, "Einheit entfernen", () => { saveMeta({einheiten: einheitList().filter(x => x !== e), einheitenListe: true}); toast("Einheit entfernt"); }); return; }
  if (t.id === "nk-add") { const v = $("#nk").value.trim(); if (!v) return; if (S.meta.kategorien.includes(v)) { toast("Gibt es schon."); return; } saveMeta({kategorien: [...S.meta.kategorien, v].sort(natcmp)}); return; }
  if (t.dataset.delk) { const k = t.dataset.delk;
    ask("Kategorie entfernen?", `Die unbenutzte Kategorie <b>${esc(k)}</b> wird aus der Liste entfernt.`, "Kategorie entfernen", () => { saveMeta({kategorien: S.meta.kategorien.filter(x => x !== k)}); toast("Kategorie entfernt"); }); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.addp) { const pid = t.dataset.addp; t.checked ? S.addSel.set(pid, S.addDef) : S.addSel.delete(pid); render(); return; }
  if (t.dataset.addbox) { const pids = [...document.querySelectorAll(`[data-addp]`)].map(x => x.dataset.addp).filter(pid => S.plaetze.get(pid)?.lager === t.dataset.addbox);
    for (const pid of pids) t.checked ? (S.addSel.has(pid) || S.addSel.set(pid, S.addDef)) : S.addSel.delete(pid); render(); return; }
  if (t.dataset.addn) { const n = Math.max(0, parseInt(t.value) || 0); if (S.addSel.has(t.dataset.addn)) S.addSel.set(t.dataset.addn, n); render(); return; }
  if (t.id === "add-def") { const n = Math.max(0, parseInt(t.value) || 0); S.addDef = n; for (const k of S.addSel.keys()) S.addSel.set(k, n); render(); return; }
  if (t.dataset.check) { t.checked ? S.checked.add(t.dataset.check) : S.checked.delete(t.dataset.check); store.set("checked", [...S.checked]); render(); return; }
  if (t.id === "kat") { S.kat = t.value; render(); return; }
  if (t.id === "f-lief" || t.id === "f-kat" || t.id === "f-ein") { S.dirty = true; return; }
  if (t.id === "onlyEmpty") { S.onlyEmpty = t.checked; render(); return; }
  if (t.dataset.rbool) { S.rep[t.dataset.rbool] = t.checked; saveRep(); render(); return; }
  if (t.id === "r-kat") { S.rep.artKat = t.value; saveRep(); render(); return; }
  if (t.id === "r-lief") { S.rep.artLief = t.value; saveRep(); render(); return; }
  if (t.closest(".stepper") && t.tagName === "INPUT") { const sp = t.closest(".stepper"); changeBestand(sp.dataset.a, sp.dataset.p, parseInt(t.value) || 0); return; }
  if (t.dataset.pf) {
    const pid = t.dataset.pid, p = S.plaetze.get(pid); if (!p) return;
    const v = t.dataset.pf === "sortierung" ? (parseInt(t.value) || 0) : t.value.trim();
    if (t.dataset.pf === "fach") {
      if (!v && !p.behaelter) { t.value = p.fach; toast("Ohne Behälter braucht der Platz ein Fach."); return; }
      if ([...S.plaetze.entries()].some(([id, q]) => id !== pid && q.lager === p.lager && q.fach.toLowerCase() === v.toLowerCase())) { t.value = p.fach; toast("Dieses Fach gibt es im Behälter schon."); return; }
    }
    savePlace(pid, {...p, [t.dataset.pf]: v}); toast("Gespeichert"); render(); return;
  }
  if (t.dataset.cren) { const v = t.value.trim(); if (!v) { render(); return; } if (moveUnit(t.dataset.cren, {behaelter: v})) toast("Behälter umbenannt"); render(); return; }
  if (t.dataset.cmove) { if (moveUnit(t.dataset.cmove, {bereich: t.value})) toast(`Verschoben nach ${t.value}`); render(); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; render(); return; }
  if (t.id === "lq") { S.lq = t.value; render(); return; }
  if (t.id === "lqs") { S.lqs = t.value; render(); return; }
  if (t.closest("#lform") && t.id?.startsWith("lf-")) S.ldirty = true;
  if (t.id === "add-q") { S.addQ = t.value; render(); return; }
  if (t.dataset.addn && S.addSel.has(t.dataset.addn)) { S.addSel.set(t.dataset.addn, Math.max(0, parseInt(t.value) || 0)); const m = $("#addpanel .meta"); if (m) m.textContent = `${S.addSel.size} Lagerplätze ausgewählt · ${[...S.addSel.values()].reduce((a, b) => a + b, 0)} Stück`; return; }
  if (t.id === "lab-q") { S.rep.labQ = t.value; saveRep(); render(); return; }
  if (t.closest("#detail") && t.id?.startsWith("f-")) S.dirty = true;
});
document.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "detail" && S.canWrite) saveArtikel(); if (e.target.id === "lform" && S.canWrite) saveLief(); });
const ENTER = {"np-beh": "#np-add", "np-fach": "#np-add", "np-sort": "#np-add", nb: "#nb-add", nk: "#nk-add", ne: "#ne-add"};
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest?.("#addpanel")) { e.preventDefault(); if (e.target.type === "number") e.target.dispatchEvent(new Event("change", {bubbles: true})); return; } if (e.key === "Escape" && S.addOpen && $("#modal").hidden && e.target.closest?.("#addpanel")) { resetAdd(); render(); return; } if (e.key === "Enter" && ENTER[e.target.id]) { e.preventDefault(); $(ENTER[e.target.id])?.click(); } });

/* ---------- Start ---------- */
syncUi();
(async () => {
  const c = window.claude;
  const [db, user, dl] = await Promise.all([c?.use("db") ?? null, c?.use("user") ?? null, c?.use("downloads") ?? null]);
  S.dl = dl;
  if (!db) { S.noDb = true; render(); return; }
  S.db = db;
  try { const w = await user?.can("data.write"); if (w === false) S.canWrite = false; } catch {}
  const onErr = e => { if (e?.code === "revoked") { S.noDb = true; } else toast("Verbindung zur Datenbank unterbrochen."); render(); };
  db.collection("artikel").onSnapshot(s => { S.artikel = new Map(s.docs.map(d => [d.id, d.data()])); S.loaded.artikel = true; render(); }, onErr);
  db.collection("plaetze").onSnapshot(s => { S.plaetze = new Map(s.docs.map(d => [d.id, normPlatz(d.data())])); S.loaded.plaetze = true; render(); }, onErr);
  db.collection("lieferanten").onSnapshot(s => { S.lief = new Map(s.docs.map(d => [d.id, {...d.data()}])); S.loaded.lief = true; render(); }, onErr);
  db.doc("meta/listen").onSnapshot(s => { if (s.exists) S.meta = {...S.meta, ...s.data()}; S.loaded.meta = true; render(); }, onErr);
})();
})();
</script>
